name: quality

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must match the Bun that wrote bun.lock: an older Bun cannot read a newer lockfile.
  BUN_VERSION: 1.4.2
  HADOLINT_VERSION: v2.15.1
  HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
  # Placeholders so that the build and type checks can validate the declared environment.
  SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_PUBLISHABLE_KEY: ci-placeholder
  ALLOWED_GOOGLE_DOMAIN: example.org
  KMS_MODE: google

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - name: set up the Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0
      - name: install hadolint
        run: |
          curl --fail --silent --show-error --location --output hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum --check
          sudo install hadolint /usr/local/bin/hadolint
          rm hadolint
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: run pre-commit on every file
        run: uvx pre-commit run --all-files --show-diff-on-failure
      - name: run the unit tests
        run: bun run test
      - name: start the local database
        run: supabase db start
      - name: run the database access-rule tests
        run: supabase test db
      - name: build the application
        run: bun run build
