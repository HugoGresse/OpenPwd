version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns:
          - eslint*
          - prettier*
          - typescript*
          - '@types/*'
    ignore:
      # SvelteKit needs the JavaScript compiler API, which TypeScript 7 no longer ships.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
